apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'
apply plugin: 'com.apollographql.apollo3'

ext {
    extName = 'Turboyomi'
    pkgNameSuffix = 'all.turboyomi'
    // Relative: Suwayomi's own extension-loading code (used by this repo's
    // CI to validate/index built APKs) concatenates packageName + extClass
    // itself, so this must stay dot-prefixed - a fully-qualified value
    // gets concatenated too, producing a garbled class name. The actual
    // fix for the applicationIdSuffix change is moving the Kotlin source
    // package to match (see all/turboyomi/ instead of all/tachidesk/).
    extClass = '.Tachidesk'
    extVersionCode = 34
}

apply from: "$rootDir/common.gradle"

apollo {
    service("service") {
        packageName.set("eu.kanade.tachiyomi.extension.all.turboyomi.apollo")
        srcDir("graphql")
        mapScalar("LongString","kotlin.Long", "eu.kanade.tachiyomi.extension.all.turboyomi.LongStringScalar")

        introspection {
            endpointUrl.set("http://localhost:4567/api/graphql")
            schemaFile.set(file("graphql/schema.graphqls"))
        }
    }
}

dependencies {
    implementation(libs.apollo.runtime) {
        exclude group: 'com.squareup.okhttp3'
        exclude group: 'com.squareup.okio'
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains.kotlinx'
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'com.squareup.okhttp3' && details.requested.name == 'okhttp' && details.requested.version == '4.9.3') {
            details.useVersion libs.okhttp.get().version
        }
    }
}
