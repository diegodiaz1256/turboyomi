name: TEMP - Generate signing keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt

      - name: Generate keystore + passwords
        run: |
          STORE_PASS=$(openssl rand -base64 24)
          KEY_PASS=$(openssl rand -base64 24)
          ALIAS="turboyomi"

          keytool -genkeypair -v \
            -keystore signingkey.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=turboyomi, OU=turboyomi, O=turboyomi, L=NA, ST=NA, C=US"

          base64 -w0 signingkey.jks > signingkey.jks.b64

          {
            echo "ALIAS=$ALIAS"
            echo "KEY_STORE_PASSWORD=$STORE_PASS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } > secrets.txt

      - name: Upload keystore + secrets (download once, then delete this workflow run + revoke)
        uses: actions/upload-artifact@v4
        with:
          name: turboyomi-signing-material
          path: |
            signingkey.jks.b64
            secrets.txt
          retention-days: 1
