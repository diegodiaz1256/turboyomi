name: TEMP - Generate signing keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt

      - name: Generate keystore + passwords
        run: |
          STORE_PASS=$(openssl rand -hex 24)
          KEY_PASS=$(openssl rand -hex 24)
          ALIAS="turboyomi"

          # -storetype JKS explicit: PKCS12 (both implicit-default and
          # explicit) failed AGP's own decrypt with "Given final block not
          # properly padded" despite keytool -list -v decrypting fine -
          # a known class of bug where newer JDKs' PKCS12 key-protection
          # cipher (PBEWithHmacSHA256AndAES_256) isn't understood by
          # AGP 8.3.1's bundled signing reader. Classic JKS uses its own
          # proprietary (non-PKCS12) format, sidestepping that entirely.
          keytool -genkeypair -v \
            -keystore signingkey.jks \
            -storetype JKS \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=turboyomi, OU=turboyomi, O=turboyomi, L=NA, ST=NA, C=US"

          keytool -list -v -keystore signingkey.jks -alias "$ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS"

          base64 -w0 signingkey.jks > signingkey.jks.b64

          printf '%s' "$ALIAS" > alias.txt
          printf '%s' "$STORE_PASS" > store_pass.txt
          printf '%s' "$KEY_PASS" > key_pass.txt

      - name: Upload keystore + secrets (download once, then delete this workflow run + revoke)
        uses: actions/upload-artifact@v4
        with:
          name: turboyomi-signing-material
          path: |
            signingkey.jks.b64
            alias.txt
            store_pass.txt
            key_pass.txt
          retention-days: 1
