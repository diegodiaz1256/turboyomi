name: TEMP - Generate signing keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt

      - name: Generate keystore + passwords
        run: |
          STORE_PASS=$(openssl rand -hex 24)
          KEY_PASS=$(openssl rand -hex 24)
          ALIAS="turboyomi"

          # Explicit -storetype PKCS12: JDK 9+ keytool defaults to PKCS12
          # internally regardless of the .jks filename, and leaving it
          # implicit previously produced a keystore AGP's own signing
          # reader failed to decrypt (KeytoolException: padding) even
          # though keytool -list -v verified it fine. Making the type
          # explicit removes that mismatch.
          keytool -genkeypair -v \
            -keystore signingkey.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=turboyomi, OU=turboyomi, O=turboyomi, L=NA, ST=NA, C=US"

          # Verify the keystore is readable with these exact passwords
          # (-v forces an actual private-key decrypt, not just a listing).
          keytool -list -v -keystore signingkey.jks -alias "$ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS"

          base64 -w0 signingkey.jks > signingkey.jks.b64

          printf '%s' "$ALIAS" > alias.txt
          printf '%s' "$STORE_PASS" > store_pass.txt
          printf '%s' "$KEY_PASS" > key_pass.txt

      - name: Upload keystore + secrets (download once, then delete this workflow run + revoke)
        uses: actions/upload-artifact@v4
        with:
          name: turboyomi-signing-material
          path: |
            signingkey.jks.b64
            alias.txt
            store_pass.txt
            key_pass.txt
          retention-days: 1
